name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x86_64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: vendor/Filee/global.json

      - name: Embed Filee engine
        run: sh scripts/embed-engine.sh ${{ matrix.rid }}

      - name: Build Molt.app
        env:
          ARCHS: ${{ matrix.arch }}
          ENGINE_DIR: build/engine-${{ matrix.rid }}/cli
        run: sh build.sh

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="dev" ;; esac
          NAME="Molt-$VERSION-${{ matrix.arch }}"
          sh scripts/make-dmg.sh build/Molt.app "dist/$NAME.dmg"
          (cd dist && shasum -a 256 "$NAME.dmg" > "$NAME.dmg.sha256")
          du -sh build/Molt.app "dist/$NAME.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: molt-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
